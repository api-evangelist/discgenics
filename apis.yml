aid: discgenics
name: DiscGenics
description: 'DiscGenics is a privately held, late-stage clinical biopharmaceutical
  company headquartered in Salt Lake City, Utah, developing allogeneic, cell-based
  regenerative biologic therapies for degenerative diseases of the spine. Its lead
  candidate, IDCT (rebonuputemcel), is a single-injection allogeneic discogenic progenitor
  cell therapy for symptomatic mild-to-moderate lumbar degenerative disc disease, manufactured
  under cGMP from donated adult human intervertebral disc tissue and granted FDA Regenerative
  Medicine Advanced Therapy (RMAT) and Fast Track designations. The company is running
  a US Phase III program (the PIVOT and CONFIRM studies) alongside a clinical study
  in Japan. DiscGenics is a therapeutics developer, not a software vendor: it publishes
  no developer portal, API, SDK or machine-readable specification of any kind.'
